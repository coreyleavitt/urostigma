name: Release

on:
  push:
    tags:
      - '*-sovereign.*'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  # Kept as a separate literal (not derived from DOTNET_VERSION) so it can
  # anchor the cache key below independently of the floating minor/patch.
  DOTNET_SDK_MAJOR: '10'

jobs:
  # A tag-push run is a separate workflow run from any develop run and
  # cannot see its `needs:` results (cross-run checks interrogation is the
  # fragile machinery RFC-010 rejects), so this mirrors ci.yml's
  # build-test job verbatim -- duplicate execution is the accepted cost of
  # a self-contained release gate.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute cache key
        id: cache-key
        run: |
          echo "value=${{ runner.os }}-dotnet${{ env.DOTNET_SDK_MAJOR }}-${{ hashFiles('build/technitiumlibrary.version') }}" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ steps.cache-key.outputs.value }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet${{ env.DOTNET_SDK_MAJOR }}-

      - name: Cache TechnitiumLibrary build output
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../TechnitiumLibrary
          key: technitiumlibrary-${{ steps.cache-key.outputs.value }}

      - name: Provision TechnitiumLibrary
        run: build/get-technitiumlibrary.sh

      - name: Build DnsServerApp
        run: dotnet build DnsServerApp/DnsServerApp.csproj -c Release

      - name: Build Apps plugins
        run: |
          set -euo pipefail
          count=0
          for proj in Apps/*/*.csproj; do
            echo "Building $proj..."
            dotnet build "$proj" -c Release
            count=$((count + 1))
          done
          echo "Built $count Apps projects."

      - name: Run tests
        run: dotnet test DnsServerCore.Tests

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sovereign
          push: true
          # github.ref_name is the tag name itself (e.g. 15.4.0-sovereign.1)
          # for a tag-push trigger -- the image tag and the git tag are the
          # same fact by construction.
          tags: ghcr.io/coreyleavitt/urostigma:${{ github.ref_name }}
          build-args: |
            REVISION=${{ github.sha }}
